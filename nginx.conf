server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # HTML 必须允许重新验证，避免 SEO 更新被长期 immutable 缓存。
    location ~* \.html$ {
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # 当前 CSS/JS 文件名没有内容哈希，不使用 immutable；每次使用前重新验证。
    location ~* \.(css|js)$ {
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # 图片与字体可长期缓存。
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 音频文件缓存策略
    location ~* \.(mp3|wav|ogg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 歌词文件缓存策略
    location ~* \.(lrc)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # 用户数据后端（可选）：读写挂载在 /app/data 的 JSON。
    # 纯静态部署下此 location 不存在，前端探测不到特征头即自动回退 localStorage。
    location = /api/userData {
        default_type application/json;
        add_header X-NCE-Storage "1" always;       # 特征头；401 上也带，供前端区分“需令牌”与“无后端”
        add_header Cache-Control "no-store" always;
        client_max_body_size 5m;
        client_body_buffer_size 256k;
        content_by_lua_file /etc/nginx/lua/userdata.lua;
    }

    # 正式 URL 规范化（Docker/OpenResty 部署）。
    location = /index.html { return 301 /; }
    location = /NCE1 { return 301 /NCE1/; }
    location = /NCE2 { return 301 /NCE2/; }
    location = /NCE3 { return 301 /NCE3/; }
    location = /NCE4 { return 301 /NCE4/; }
    location = /NCE1/index.html { return 301 /NCE1/; }
    location = /NCE2/index.html { return 301 /NCE2/; }
    location = /NCE3/index.html { return 301 /NCE3/; }
    location = /NCE4/index.html { return 301 /NCE4/; }

    # 本项目使用 hash 路由；不存在的 URL 应返回真实 404。
    location = / {
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
